# Set mod key
$mod = SUPER

# Terminal
bind = $mod, RETURN, exec, alacritty

# Kill window
bind = $mod SHIFT, Q, killactive

# App launcher
bind = $mod, D, exec, rofi -show drun

# File manager (root)
bind = $mod SHIFT, F3, exec, gksu pcmanfm

# Restart dunst
bind = $mod SHIFT, D, exec, killall dunst && notify-send "restart dunst"

# Screenshots
bind = , PRINT, exec, scrot ~/Screenshot/System%b%dAt%H_%M_%S.png
bind = $mod, PRINT, exec, scrot -u ~/Screenshot/System%b%dAt%H_%M_%S.png
bind = $mod SHIFT, PRINT, exec, i3-scrot -s

# Focus (vim keys)
bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, L, movefocus, r

# Focus (arrows)
bind = $mod, LEFT, movefocus, l
bind = $mod, DOWN, movefocus, d
bind = $mod, UP, movefocus, u
bind = $mod, RIGHT, movefocus, r

# Move windows
bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, J, movewindow, d
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, L, movewindow, r

# Move windows (arrows)
bind = $mod SHIFT, LEFT, movewindow, l
bind = $mod SHIFT, DOWN, movewindow, d
bind = $mod SHIFT, UP, movewindow, u
bind = $mod SHIFT, RIGHT, movewindow, r

# Workspaces (Hyprland uses numbers directly)
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8

# Move window to workspace
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8

# Brightness
bind = , XF86MonBrightnessUp, exec, dunstctl close-all && brightnessctl set +10% && notify-send "$(brightnessctl g)%"
bind = , XF86MonBrightnessDown, exec, dunstctl close-all && brightnessctl set 10%- && notify-send "$(brightnessctl g)%"

# Volume
bind = , XF86AudioRaiseVolume, exec, amixer -q sset Master 1+ unmute
bind = , XF86AudioLowerVolume, exec, amixer -q sset Master 1- unmute
bind = , XF86AudioMute, exec, amixer -q sset Master toggle

# Split (Hyprland uses dwindle/master, not i3 splits)
bind = $mod, B, togglesplit
bind = $mod, V, togglesplit

# Fullscreen
bind = $mod, F, fullscreen

# Layouts (approximation)
bind = $mod, S, layoutmsg, togglesplit
bind = $mod, W, layoutmsg, togglesplit
bind = $mod, E, layoutmsg, togglesplit

# Floating toggle
bind = $mod SHIFT, SPACE, togglefloating

# Focus mode toggle (not identical)
bind = $mod, SPACE, cyclenext

# Sticky
bind = $mod SHIFT, S, pin

# Focus parent (no direct equivalent, approximate)
bind = $mod, A, layoutmsg, focusmaster

# Scratchpad (Hyprland uses special workspace)
bind = $mod SHIFT, MINUS, movetoworkspace, special
bind = $mod, MINUS, togglespecialworkspace

# Workspace next/prev
bind = $mod CTRL, RIGHT, workspace, e+1
bind = $mod CTRL, LEFT, workspace, e-1

# Reload config
bind = $mod SHIFT, R, exec, hyprctl reload

# Exit Hyprland
bind = $mod SHIFT, E, exit

# Lock screen
bind = $mod, 9, exec, hyprlock
